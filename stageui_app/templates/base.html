<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Blog Notes{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <span class="brand">Blog Notes</span>
    {% if user %}
      <span data-testid="welcome">Welcome, {{ user.display_name }}</span>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <button type="submit" class="secondary">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
