{% extends "base.html" %}
{% block title %}New post · Blog Notes{% endblock %}
{% block content %}
<section class="card">
  <h1>New post</h1>
  {% if error %}<p class="error" role="alert" data-testid="form-error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('new_post') }}">
    <label for="title">Title</label>
    <input id="title" name="title" value="{{ form.title }}">
    <label for="author">Author</label>
    <input id="author" value="{{ user.display_name }}" readonly>
    <label for="content">Content</label>
    <textarea id="content" name="content" rows="10">{{ form.content }}</textarea>
    <label for="tags">Tags</label>
    <input id="tags" name="tags" value="{{ form.tags }}" placeholder="comma, separated">
    <button type="submit">Save post</button>
  </form>
</section>
{% endblock %}
